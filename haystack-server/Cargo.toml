[package]
name = "rusty-haystack-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Axum HTTP API server implementing Project Haystack operations"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "haystack_server"

[dependencies]
haystack-core.workspace = true
haystack-client.workspace = true
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["cors"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
base64.workspace = true
parking_lot.workspace = true
log.workspace = true
env_logger.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
time.workspace = true
futures-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
# `util` carries ServiceExt::oneshot, which drives the router's middleware
# stack without binding a socket. Test-only: axum and tower-http bring their
# own tower at runtime.
tower = { workspace = true, features = ["util"] }

[[bench]]
name = "benchmarks"
harness = false
