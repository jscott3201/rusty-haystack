[package]
name = "rusty-haystack-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP and WebSocket client for Project Haystack servers"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "haystack_client"

[dependencies]
haystack-core.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "tls12", "std"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
base64.workspace = true
futures-util.workspace = true
dashmap.workspace = true
flate2.workspace = true
rand.workspace = true
zeroize.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
rcgen = { workspace = true, features = ["ring", "pem"] }
time.workspace = true
