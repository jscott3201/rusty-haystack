[package]
name = "niagara-read"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Read Niagara nHaystack points via rusty-haystack-client"
publish = false

[lints]
workspace = true

[[bin]]
name = "niagara-read"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
haystack-client.workspace = true
haystack-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
base64.workspace = true
