[graph]
targets = []
all-features = false
no-default-features = false
exclude = ["rusty-haystack"]

[advisories]
# zstd 0.13 reaches the graph only through arrow-ipc under the optional
# analytics `sql` feature (DataFusion 55 requires Arrow 59; the fixes need
# zstd >= 0.14.3, i.e. Arrow 60). The SQL path never reads or writes Arrow
# IPC: spill is disabled and file-backed tables are refused. Remove all three
# together with the DataFusion/Arrow 60 move.
ignore = [
    { id = "RUSTSEC-2026-0391", reason = "zstd via arrow-ipc only; no IPC (de)compression is reachable (spill disabled, no file tables). Tracked: https://github.com/jscott3201/rusty-haystack/issues/131" },
    { id = "RUSTSEC-2026-0398", reason = "zstd Seekable is never used; zstd via arrow-ipc only, unreachable (spill disabled, no file tables). Tracked: https://github.com/jscott3201/rusty-haystack/issues/131" },
    { id = "RUSTSEC-2026-0403", reason = "no streaming zstd decompression is reachable: no IPC reads, spill disabled. Tracked: https://github.com/jscott3201/rusty-haystack/issues/131" },
]
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "OpenSSL",
    "CC0-1.0",
]
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
