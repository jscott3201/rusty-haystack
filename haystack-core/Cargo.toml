[package]
name = "rusty-haystack-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core types, codecs, and data structures for Project Haystack"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "haystack_core"

[features]
default = []
chrono-tz = ["dep:chrono-tz"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
slotmap.workspace = true
smallvec = { workspace = true, features = ["serde"] }
parking_lot.workspace = true
indexmap.workspace = true
tokio = { workspace = true, features = ["sync"] }
sha2.workspace = true
hmac.workspace = true
pbkdf2 = { workspace = true, features = ["hmac"] }
base64.workspace = true
rand.workspace = true
subtle.workspace = true
regex.workspace = true
roaring.workspace = true
rustc-hash.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Already a normal dependency; declared here so integration tests can build the
# DateTime<FixedOffset> that HDateTime::new takes. Adds nothing to the tree.
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt", "macros"] }
criterion = { workspace = true, features = ["html_reports"] }
test-case.workspace = true
tempfile.workspace = true

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "baseline"
harness = false
