name: Artifact Qualification

# Manual, credential-free rehearsal; this workflow has no publication job.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build native candidates once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin==1.15.0
      - run: cargo fetch --locked
      - name: Build and seal candidates
        env:
          SOURCE: ${{ github.sha }}
        run: |
          python scripts/release/build.py cli --repo "$GITHUB_WORKSPACE" --source "$SOURCE" --target "$TARGET" --bundle "$RUNNER_TEMP/candidates/cli" --work "$RUNNER_TEMP/build-cli"
          python scripts/release/build.py wheel --repo "$GITHUB_WORKSPACE" --source "$SOURCE" --target "$TARGET" --python "$(command -v python)" --bundle "$RUNNER_TEMP/candidates/wheel" --work "$RUNNER_TEMP/build-wheel"
          python scripts/release/build.py sdist --repo "$GITHUB_WORKSPACE" --source "$SOURCE" --target source --python "$(command -v python)" --bundle "$RUNNER_TEMP/candidates/sdist" --work "$RUNNER_TEMP/build-sdist"
      - uses: actions/upload-artifact@v4
        id: cli
        with:
          name: native-candidate-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidates/cli
          if-no-files-found: error
      - name: Retain artifact service identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.cli.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.cli.outputs.artifact-digest }}
        run: |
          printf 'Artifact service ID: %s\nService SHA-256 (distinct from package digest): %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: wheel
        with:
          name: native-candidate-wheel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidates/wheel
          if-no-files-found: error
      - name: Retain artifact service identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.wheel.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.wheel.outputs.artifact-digest }}
        run: |
          printf 'Artifact service ID: %s\nService SHA-256 (distinct from package digest): %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: sdist
        with:
          name: native-candidate-sdist-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidates/sdist
          if-no-files-found: error
      - name: Retain artifact service identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.sdist.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.sdist.outputs.artifact-digest }}
        run: |
          printf 'Artifact service ID: %s\nService SHA-256 (distinct from package digest): %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-build-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-*/*.log
          if-no-files-found: warn

  qualify:
    name: Download, install, verify and stage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate-cli-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/cli
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate-wheel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/wheel
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate-sdist-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/sdist
      - name: Qualify downloaded candidates and stage identical bytes
        env:
          SOURCE: ${{ github.sha }}
        run: |
          python scripts/release/qualify.py --repo "$GITHUB_WORKSPACE" --input "$RUNNER_TEMP/download" --source "$SOURCE" --profile native --target x86_64-unknown-linux-gnu --python "$(command -v python)" --work "$RUNNER_TEMP/consumer-work" --evidence "$RUNNER_TEMP/evidence"
          python scripts/release/artifacts.py stage --repo "$GITHUB_WORKSPACE" --input "$RUNNER_TEMP/download" --source "$SOURCE" --profile native --target x86_64-unknown-linux-gnu --evidence "$RUNNER_TEMP/evidence" --output "$RUNNER_TEMP/publication" > "$RUNNER_TEMP/stage.json"
          python scripts/release/artifacts.py check-staged --repo "$GITHUB_WORKSPACE" --input "$RUNNER_TEMP/publication" --source "$SOURCE" --profile native --target x86_64-unknown-linux-gnu --receipt "$RUNNER_TEMP/stage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-staged-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-proof-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage.json
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/download/*/receipts
            ${{ runner.temp }}/consumer-work/**/*.log
          if-no-files-found: error
