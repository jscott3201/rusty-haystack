name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check parsed package version against tag
        run: python scripts/release/artifacts.py version --repo "$GITHUB_WORKSPACE" --tag "$GITHUB_REF_NAME"
      - run: cargo test --locked --workspace --exclude rusty-haystack

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install pinned cross builder
        if: matrix.cross
        run: |
          cargo install cross --version 0.2.5 --locked
          docker pull ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5
      - name: Build and seal one archive
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
          CROSS_BUILD: ${{ matrix.cross }}
        run: |
          extra=()
          if [ "$CROSS_BUILD" = "true" ]; then
            extra=(--cross-image ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5)
          fi
          python scripts/release/build.py cli --repo "$GITHUB_WORKSPACE" --source "$SOURCE" --target "$TARGET" --bundle "$RUNNER_TEMP/candidate" --work "$RUNNER_TEMP/build-work" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        id: candidate
        with:
          name: candidate-cli-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
      - name: Retain artifact service identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: |
          printf 'Artifact service ID: %s\nService SHA-256 (distinct from package digest): %s\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cli-build-logs-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-work/*.log
          if-no-files-found: warn

  qualify-binaries:
    name: Qualify downloaded binaries
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: candidate-cli-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/cli-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: candidate-cli-aarch64-unknown-linux-gnu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/cli-aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: candidate-cli-x86_64-apple-darwin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/cli-x86_64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: candidate-cli-aarch64-apple-darwin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/cli-aarch64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: candidate-cli-x86_64-pc-windows-msvc-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download/cli-x86_64-pc-windows-msvc
      - name: Qualify downloaded candidates and stage identical bytes
        env:
          SOURCE: ${{ github.sha }}
        run: |
          python scripts/release/qualify.py --repo "$GITHUB_WORKSPACE" --input "$RUNNER_TEMP/download" --source "$SOURCE" --profile binaries --python "$(command -v python)" --work "$RUNNER_TEMP/consumer-work" --evidence "$RUNNER_TEMP/evidence"
          python scripts/release/artifacts.py stage --repo "$GITHUB_WORKSPACE" --input "$RUNNER_TEMP/download" --source "$SOURCE" --profile binaries --evidence "$RUNNER_TEMP/evidence" --output "$RUNNER_TEMP/publication" > "$RUNNER_TEMP/stage.json"
          python scripts/release/artifacts.py check-staged --repo "$GITHUB_WORKSPACE" --input "$RUNNER_TEMP/publication" --source "$SOURCE" --profile binaries --receipt "$RUNNER_TEMP/stage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-binaries-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binaries-proof-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage.json
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/download/*/receipts
            ${{ runner.temp }}/consumer-work/**/*.log
          if-no-files-found: error

  publish-crates:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, qualify-binaries]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2

      # Crates are separately packaged from source, not the qualified CLI archive.
      - name: Publish rusty-haystack-core
        run: cargo publish -p rusty-haystack-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish rusty-haystack-client
        run: cargo publish -p rusty-haystack-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish rusty-haystack-server
        run: cargo publish -p rusty-haystack-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish rusty-haystack-cli
        run: cargo publish -p rusty-haystack-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, qualify-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: qualified-binaries-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
      - uses: actions/download-artifact@v4
        with:
          name: binaries-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
      - name: Verify staged files immediately before publication
        env:
          SOURCE: ${{ github.sha }}
        run: python scripts/release/artifacts.py check-staged --repo "$GITHUB_WORKSPACE" --input "$RUNNER_TEMP/publication" --source "$SOURCE" --profile binaries --receipt "$RUNNER_TEMP/proof/stage.json"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/publication/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
