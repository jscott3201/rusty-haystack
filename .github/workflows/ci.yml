name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    # `edited` is not in the default set, and retargeting a PR fires only that.
    # Without it, a PR moved from dev to main keeps the ubuntu-only checks its
    # dev-targeted run produced.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  ci-policy:
    name: CI policy
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      test-os: ${{ steps.plan.outputs.test-os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test policy and workflow wiring
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Test benchmark capture controls
        run: python3 -m unittest discover -s scripts/bench -p 'test_capture.py' -v
      - name: Test artifact provenance and staging controls
        run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Select branch coverage
        id: plan
        env:
          CI_EVENT_ACTION: ${{ github.event.action }}
        run: python3 scripts/ci/policy.py plan >> "$GITHUB_OUTPUT"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo +1.99.0 fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.99.0 clippy --locked --workspace --exclude rusty-haystack --all-targets -- -D warnings
      - run: cargo +1.99.0 clippy --locked -p rusty-haystack-core --features chrono-tz --all-targets -- -D warnings

  # The tested policy expands main to all three OSes and dev to Ubuntu.
  # A retargeted PR uses its current base branch, including on `edited`.
  test:
    name: Test (${{ matrix.os }})
    needs: ci-policy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.ci-policy.outputs.test-os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo +1.99.0 test --locked --workspace --exclude rusty-haystack
      - run: cargo +1.99.0 test --locked -p rusty-haystack-core --features chrono-tz

  # Separate package invocations prevent workspace members from unifying extra
  # dependency features into core's supported minimal/default builds.
  core-features:
    name: Core minimal and default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-features
      - run: cargo +1.99.0 clippy --locked -p rusty-haystack-core --no-default-features --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked -p rusty-haystack-core --no-default-features
      - run: cargo +1.99.0 clippy --locked -p rusty-haystack-core --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked -p rusty-haystack-core

  # Keep one exact current-stable lane separate from the conditional OS matrix:
  # compatibility coverage should not multiply platform jobs.
  current-stable:
    name: Current stable (Rust 1.99.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: current-stable-1.99.0
      - run: cargo +1.99.0 clippy --locked --workspace --exclude rusty-haystack --all-targets -- -D warnings
      - run: cargo +1.99.0 clippy --locked -p rusty-haystack-core --features chrono-tz --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked --workspace --exclude rusty-haystack
      - run: cargo +1.99.0 test --locked -p rusty-haystack-core --features chrono-tz

  # The PyO3 crate is excluded from `cargo test --locked --workspace`, so nothing above
  # covers it. Without this job the Python suite rots unnoticed — 11 of its tests
  # spent four months failing against APIs removed in v0.8.0.
  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: pyo3
      # Exact version: setup-uv stopped publishing floating major tags after v7,
      # so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
      # Pinned rather than inherited from the runner image, so the interpreter
      # the extension is built against does not drift. pyo3 is configured
      # without abi3, making every build interpreter-specific.
      - run: uv venv --python 3.12
      - run: uv pip install maturin==1.15.0 pytest
      # The Clippy job above excludes this crate because `cargo clippy --locked --workspace`
      # needs an interpreter to resolve the pyo3 build script. This job has one, so
      # the exclusion is about where the lint runs, not whether it runs.
      - name: Clippy
        run: |
          source .venv/bin/activate
          cargo +1.99.0 clippy --locked -p rusty-haystack --all-targets -- -D warnings
      # Activate rather than `uv run`, and reach the crate with -m. `uv run`
      # inside rusty-haystack/ sees its pyproject.toml, builds a second .venv
      # for that project, and then cannot find the maturin installed here.
      - name: Build and install the extension
        run: |
          source .venv/bin/activate
          maturin develop --locked --release -m rusty-haystack/Cargo.toml
      - name: Run Python tests
        run: |
          source .venv/bin/activate
          pytest rusty-haystack/tests -q

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.99.0"
          arguments: --locked --all-features

  codeql:
    name: CodeQL
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml

  # Keep the explicit needs list synchronized with policy.py, its independent
  # tests, and docs/support-matrix.md. Never infer required jobs from toJSON(needs).
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [ci-policy, fmt, clippy, test, current-stable, python, deny, core-features, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every check to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_PROFILE: ${{ needs.ci-policy.outputs.profile }}
        run: python3 scripts/ci/policy.py aggregate
