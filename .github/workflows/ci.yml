name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    # `edited` is not in the default set, and retargeting a PR fires only that.
    # Without it, a PR moved from dev to main keeps the ubuntu-only checks its
    # dev-targeted run produced.
    types: [opened, synchronize, reopened, edited]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude rusty-haystack --all-targets -- -D warnings

  # Anything targeting main runs the full three-OS matrix. Everything else
  # (dev PRs, dev pushes) tests on ubuntu alone. Jobs run in parallel, so the
  # slowest one paces the workflow, and windows takes about twice what the
  # others do — 3m00s against ubuntu's 1m30s on the 2026-07-25 baseline run.
  # Dropping it takes the slowest test job to 42s.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --exclude rusty-haystack

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
