name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    # `edited` is not in the default set, and retargeting a PR fires only that.
    # Without it, a PR moved from dev to main keeps the ubuntu-only checks its
    # dev-targeted run produced.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo +1.97.1 fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.97.1 clippy --workspace --exclude rusty-haystack --all-targets -- -D warnings
      - run: cargo +1.97.1 clippy -p rusty-haystack-core --features chrono-tz --all-targets -- -D warnings

  # Anything targeting main runs the full three-OS matrix. Everything else
  # (dev PRs, dev pushes) tests on ubuntu alone. Jobs run in parallel, so the
  # slowest one paces the workflow, and windows takes about twice what the
  # others do — 3m00s against ubuntu's 1m30s on the 2026-07-25 baseline run.
  # Dropping it takes the slowest test job to 42s.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo +1.97.1 test --workspace --exclude rusty-haystack
      - run: cargo +1.97.1 test -p rusty-haystack-core --features chrono-tz

  # Keep one exact current-stable lane separate from the conditional OS matrix:
  # compatibility coverage should not multiply platform jobs.
  current-stable:
    name: Current stable (Rust 1.98.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: current-stable-1.98.1
      - run: cargo +1.98.1 clippy --workspace --exclude rusty-haystack --all-targets -- -D warnings
      - run: cargo +1.98.1 clippy -p rusty-haystack-core --features chrono-tz --all-targets -- -D warnings
      - run: cargo +1.98.1 test --workspace --exclude rusty-haystack
      - run: cargo +1.98.1 test -p rusty-haystack-core --features chrono-tz

  # The PyO3 crate is excluded from `cargo test --workspace`, so nothing above
  # covers it. Without this job the Python suite rots unnoticed — 11 of its tests
  # spent four months failing against APIs removed in v0.8.0.
  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: pyo3
      # Exact version: setup-uv stopped publishing floating major tags after v7,
      # so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
      # Pinned rather than inherited from the runner image, so the interpreter
      # the extension is built against does not drift. pyo3 is configured
      # without abi3, making every build interpreter-specific.
      - run: uv venv --python 3.12
      - run: uv pip install maturin==1.15.0 pytest
      # The Clippy job above excludes this crate because `cargo clippy --workspace`
      # needs an interpreter to resolve the pyo3 build script. This job has one, so
      # the exclusion is about where the lint runs, not whether it runs.
      - name: Clippy
        run: |
          source .venv/bin/activate
          cargo +1.97.1 clippy -p rusty-haystack --all-targets -- -D warnings
      # Activate rather than `uv run`, and reach the crate with -m. `uv run`
      # inside rusty-haystack/ sees its pyproject.toml, builds a second .venv
      # for that project, and then cannot find the maturin installed here.
      - name: Build and install the extension
        run: |
          source .venv/bin/activate
          maturin develop --release -m rusty-haystack/Cargo.toml
      - name: Run Python tests
        run: |
          source .venv/bin/activate
          pytest rusty-haystack/tests -q

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
